<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Retro Game Store!</title>
    <style>
        body {
            background-image: url('./images/Retro_Game_Stuff.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px; /* Adjust this height as needed */
        }

        .floating-image {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1 style="color: white; text-align: center;">Welcome to Virtual Retro Game Store!</h1>
    <div class="image-container">
        <img src="./images/Mario.png" alt="mario" class="floating-image">  
    </div>
    <p style="color: white; text-align: center; background-color:grey; font-size: 20px;">
        Retro Game Store is one of the best thing that I hunted everywhere that I love.
    </p>
    <a href="introduction.html" class="button">Go Meet Kirby</a>
</body>
</html>
